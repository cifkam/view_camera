<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI, NumberController } from 'three/addons/libs/lil-gui.module.min.js';
const Cam = window.Cam, Epi = window.Epi;   // classic scripts, so the page also runs from file://

// lil-gui number controller whose slider track follows a non-linear mapping; the number field stays in real
// units. lil-gui maps the pointer to a linear value in [min, max] and passes it to _snapClampSetValue (after
// _setDraggingStyle(true)); that linear value is reinterpreted through { fromFrac(t, min, max), toFrac(v, min, max) }.
class MappedNumberController extends NumberController {
  constructor(parent, object, property, min, max, step, map) {
    super(parent, object, property, min, max, step);
    this._map = map;
    this.updateDisplay();
  }
  _setDraggingStyle(active, type) {
    this._sliderDrag = active && type !== 'vertical';
    return super._setDraggingStyle(active, type);
  }
  _snapClampSetValue(v) {
    if (this._sliderDrag && this._map) v = this._map.fromFrac((v - this._min) / (this._max - this._min), this._min, this._max);
    return super._snapClampSetValue(v);
  }
  updateDisplay() {
    super.updateDisplay();
    if (this._hasSlider && this._map)
      this.$fill.style.width = 100 * Math.max(0, Math.min(1, this._map.toFrac(this.getValue(), this._min, this._max))) + '%';
    return this;
  }
}
// logarithmic track: equal track lengths are equal ratios
const LOG_MAP = {
  fromFrac: (t, lo, hi) => Math.exp(Math.log(lo) + t * (Math.log(hi) - Math.log(lo))),
  toFrac: (v, lo, hi) => (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)),
};
// lil-gui moves a slider by one step per pixel of wheel delta, so a single wheel notch (~100 px) can throw it a
// hundred steps; instead a notch moves it a fixed share of the track (in the mapped track for mapped sliders). The
// track position is kept unrounded between events, so small trackpad deltas still add up past the step rounding.
const WHEEL_NOTCH = 0.02;
const LINEAR_MAP = { fromFrac: (t, lo, hi) => lo + t * (hi - lo), toFrac: (v, lo, hi) => (v - lo) / (hi - lo) };
function tameWheel(c) {
  const map = c._map || LINEAR_MAP;
  let frac = 0, last = null;
  c.domElement.addEventListener('wheel', e => {
    const onSlider = c.$slider.contains(e.target), onInput = e.target === c.$input && c._inputFocused;
    if (!onSlider && !onInput) return;
    if (onSlider && Math.abs(e.deltaX) < Math.abs(e.deltaY) && c._hasScrollBar) return;   // let the panel scroll
    e.preventDefault(); e.stopPropagation();
    if (c.getValue() !== last) frac = map.toFrac(c.getValue(), c._min, c._max);
    const px = (e.deltaX - e.deltaY) * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    frac = Math.max(0, Math.min(1, frac + px / 100 * WHEEL_NOTCH));

const addMapped = (folder, obj, prop, min, max, step, map) => new MappedNumberController(folder, obj, prop, min, max, step, map);

// ----------------------------------------------------------------------------
// Scene: objects in the world frame (Z up, metres) and their colours, shared by the 3D view and the pictures
// ----------------------------------------------------------------------------
const COL = {
  board: '#8c939d', boardLight: '#e9e9e9', boardDark: '#2b2d31',
  cube: '#4fa8ff', pyramid: '#f2d14b', cylinder: '#5fd38d',
  x: '#ff5c5c', y: '#5fd35f', z: '#5c8cff', grid: '#4a4f58',
  cams: ['#ff9f43', '#2ed3b7'],   // camera 1, camera 2
  epi: '#ff5cd1',                 // the epipolar plane and lines of the selection
  epipole: '#ffd84f', baseline: '#ffd84f', selected: '#ffffff', probe: '#ffb347',
};
const SHAPES = {
  board: { label: 'checkerboard', geom: Cam.checkerboard(7, 5, 0.25), color: COL.board },
  cube: { label: 'cube', geom: Cam.cube(1), color: COL.cube },
  pyramid: { label: 'pyramid', geom: Cam.pyramid(1.2, 1.5), color: COL.pyramid },
  cylinder: { label: 'cylinder', geom: Cam.cylinder(0.4, 1.6), color: COL.cylinder },
  axes: { label: 'world axes', geom: Cam.axes(1), color: null, edgeColors: [COL.x, COL.y, COL.z] },
  grid: { label: 'ground grid', geom: Cam.groundGrid(10, 1), color: COL.grid, noVertices: true },

const PLACES = {
  board: [-1.6, 0.6, 0, 20], cube: [2.4, 0.4, 0, 25], pyramid: [-0.4, 3.2, 0, 0], cylinder: [-2.9, 3.0, 0, 0],
};
const SCENE_CENTRE = [0, 1.8, 0.6];
const placed = key => Cam.placeVertices(SHAPES[key].geom.vertices, PLACES[key] ? PLACES[key].slice(0, 3) : [0, 0, 0], PLACES[key] ? PLACES[key][3] : 0);

// ----------------------------------------------------------------------------
// Parameters (saved in localStorage)
// ----------------------------------------------------------------------------
const round1 = x => Math.round(x * 10) / 10;
const aimed = (C, target = SCENE_CENTRE) => { const a = Cam.lookAt(C, target); return { x: C[0], y: C[1], z: C[2], yaw: round1(a.yaw), pitch: round1(a.pitch), roll: 0 }; };
// whole setups of the two cameras: the usual converging pair, a rectified stereo pair (same orientation, side by side:
// the epipolar lines come out horizontal and the epipoles at infinity), and a camera moving straight ahead (the
// epipole is then the focus of expansion, the lines radiate from it)
const PRESETS = {
  'converging pair': [aimed([-2.2, -3.4, 1.6]), aimed([1.8, -3.9, 1.3])],
  'rectified stereo': [{ x: -0.5, y: -4.5, z: 1.4, yaw: 0, pitch: -8, roll: 0 }, { x: 0.5, y: -4.5, z: 1.4, yaw: 0, pitch: -8, roll: 0 }],
  'forward motion': [{ x: 0, y: -5.5, z: 1.1, yaw: 0, pitch: 0, roll: 0 }, { x: 0, y: -3.8, z: 1.1, yaw: 0, pitch: 0, roll: 0 }],
};
const DEFAULTS = {
  preset: 'converging pair',
  focal: 24, sensorW: 36, resolution: '1280×720', W: 1280, H: 720,
  cams: PRESETS['converging pair'],
  show: { board: true, cube: true, pyramid: true, cylinder: true, axes: true, grid: true },
  selected: { kind: 'vertex', obj: 'pyramid', i: 4 },   // the apex; or { kind: 'pixel', cam, uv }
  probe: null,   // metres along a picked pixel's ray: the point dragged along it (null: on the last but one marked)
  planeScale: 25, showPlane: true, showPencil: false, showSamples: true,

const STORE = 'epipolar.state';
const clone = o => JSON.parse(JSON.stringify(o));
function loadState() {
  const P = clone(DEFAULTS);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    for (const k of Object.keys(P)) if (k in saved) {
      if (k === 'cams' && Array.isArray(saved.cams) && saved.cams.length === 2) P.cams = saved.cams.map((c, i) => ({ ...P.cams[i], ...c }));
      else if (k === 'show') for (const j of Object.keys(P.show)) { if (saved.show && j in saved.show) P.show[j] = saved.show[j]; }
      else P[k] = saved[k];

const P = loadState();
const saveState = () => { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) { /* ignore */ } };

const RESOLUTIONS = { '640×480': [640, 480], '1280×720': [1280, 720], '1920×1080': [1920, 1080], '1600×1200': [1600, 1200] };
const SENSORS = { 'full frame (36 mm)': 36, 'APS-C (23.5 mm)': 23.5, '1″ (13.2 mm)': 13.2, 'phone 1/1.3″ (9.8 mm)': 9.8 };

// ----------------------------------------------------------------------------
// The two cameras (the same intrinsics) and their epipolar geometry
// ----------------------------------------------------------------------------
let cams, geo;
function buildCameras() {
  const fx = Cam.fxFromFocal(P.focal, P.sensorW, P.W);
  const K = Cam.intrinsics({ fx, fy: fx, cx: P.W / 2, cy: P.H / 2 });
  cams = P.cams.map(c => {
    const R = Cam.rotationFromYawPitchRoll(c.yaw, c.pitch, c.roll), C = [c.x, c.y, c.z];
    return { ...Cam.makeCamera({ K, R, t: Cam.translationFromCentre(R, C) }), C };
  });

  const baseline = Cam.norm(Cam.sub(cams[1].C, cams[0].C));

}
// the epipolar line in camera k of a pixel of the other camera
const lineIn = (k, uvOther) => k === 1 ? Epi.lineInImage2(geo.F, uvOther) : Epi.lineInImage1(geo.F, uvOther);
const project = (X, k) => Cam.projectPoint(X, cams[k]);
const inFront = (q, k) => q.Xc[2] > cams[k].near;

// what the selection is in each picture: the point (if it shows), the line through it from the other picture, and,
// for a pixel, points along its ray
// Points along a picked pixel's ray, spaced by the angle at the other camera's centre: its rays to them turn by equal
// steps across its view, from where the ray comes into its picture (the line enters it) to where it leaves (or a
// distance cap), so their images come out about evenly along its epipolar line and all show. They stay put; the
// probe, a further point dragged along the ray in the 3D view, starts on the last but one of them (P.probe null) and leaves
// that one's line behind when moved. In the epipolar plane, with b = C_k − C_o and the ray's direction r split into dx
// along b and dy across it, the point d along the ray is seen at φ(d) = atan2(d dy, |b| + d dx) from b; inverted,
// d = |b| sin φ / (dy cos φ − dx sin φ).
const SAMPLES = 6;
const PROBE_RANGE = [0.2, 80];
const SAMPLE_CAP = 40;   // metres: no point further along the ray
function pixelSelection(k, uv) {
  const o = 1 - k, ray = Epi.pixelRay(cams[k], uv);
  const lines = []; lines[o] = lineIn(o, uv); lines[k] = null;
  const b = Cam.sub(ray.C, cams[o].C), nb = Cam.norm(b), e1 = Cam.scale(b, 1 / nb);
  const dx = Cam.dot(ray.dir, e1), dy = Cam.norm(Cam.sub(ray.dir, Cam.scale(e1, dx)));
  let depths;
  if (nb > 1e-9 && dy > 1e-6) {
    const e2 = Cam.scale(Cam.sub(ray.dir, Cam.scale(e1, dx)), 1 / dy);
    const phiAt = d => Math.atan2(d * dy, nb + d * dx), phiCap = phiAt(SAMPLE_CAP);
    // the angles at which the other camera's picture edges cut the plane: where the ray comes into its view and leaves
    let lo = phiAt(0.05), hi = phiCap;
    const seg = lines[o] && Epi.clipLine(lines[o], 0, 0, P.W, P.H);
    if (seg) {
      const phis = seg.map(px => { const u = Epi.pixelRay(cams[o], px).dir; return Math.atan2(Cam.dot(u, e2), Cam.dot(u, e1)); })
        .filter(a => a > 0 && a < phiCap).sort((a, c) => a - c);
      if (phis.length === 2) [lo, hi] = phis;
      else if (phis.length === 1) lo = phis[0];
    }
    depths = Array.from({ length: SAMPLES }, (_, j) => {
      const phi = lo + (hi - lo) * (j + 0.5) / SAMPLES;
      return nb * Math.sin(phi) / (dy * Math.cos(phi) - dx * Math.sin(phi));
    });
  } else depths = Array.from({ length: SAMPLES }, (_, j) => SAMPLE_CAP * (j + 1) / (SAMPLES + 1));   // the ray along the baseline
  const samples = depths.map(d => Cam.add(ray.C, Cam.scale(ray.dir, d)));
  const pd = P.probe ?? depths[SAMPLES - 2];
  const probe = { depth: pd, X: Cam.add(ray.C, Cam.scale(ray.dir, pd)) };

}
function selection() {

    if (!SHAPES[s.obj] || !P.show[s.obj]) return null;
    const verts = placed(s.obj);
    if (s.i >= verts.length) return null;
    const X = verts[s.i], q = [project(X, 0), project(X, 1)];
    const ok = [inFront(q[0], 0), inFront(q[1], 1)];
    // picked in a picture (s.cam): the same as picking its pixel there (its ray, the points along it and the other
    // camera's rays to them, its line only in the other picture), except that the point nearest the vertex is the
    // vertex itself, the one of them that is really there
    if (s.cam !== undefined && ok[s.cam]) {

      sel.samples[near] = X;
      return { ...sel, vertex: { X, q, ok, at: near, depth } };

// ----------------------------------------------------------------------------
// The pictures (2D canvases). tf maps pixel coordinates to canvas units: X = ox + s u, Y = oy + s v.
// ----------------------------------------------------------------------------
const picCanvas = [document.getElementById('pic0'), document.getElementById('pic1')];
const texCanvas = [document.createElement('canvas'), document.createElement('canvas')];
const picTf = [null, null];
const MARGIN = 0.12;   // drawn margin around each picture, as a fraction of its width
const PENCIL = Array.from({ length: 8 }, (_, i) => `hsl(${i * 45}, 75%, 62%)`);
function strokeLines(ctx, tf, lines) {
  ctx.beginPath();

    ctx.moveTo(tf.ox + tf.s * l[0][0], tf.oy + tf.s * l[0][1]);
    for (let j = 1; j < l.length; j++) ctx.lineTo(tf.ox + tf.s * l[j][0], tf.oy + tf.s * l[j][1]);
  }

}
// a line a u + b v + c = 0 across the drawn area (the picture and its margin)
function drawLine(ctx, tf, l, color, width, dash = []) {

  if (!seg) return;

// the scene as camera k sees it
function drawScene(ctx, tf, k, lw) {

  const order = ['grid', 'board', 'axes', 'cylinder', 'pyramid', 'cube'];
  for (const key of order) {
    if (!P.show[key]) continue;
    const s = SHAPES[key], verts = placed(key);

    if (sel.kind === 'vertex' && sel.ok[k]) ring(sel.q[k].uv, lw * 5, COL.selected);

  });
  const end = () => { if (!dragging) return; dragging = false; controls.enabled = true; renderer.domElement.style.cursor = ''; };
  renderer.domElement.addEventListener('pointerup', end);
  renderer.domElement.addEventListener('pointercancel', end);
}
// a camera's centre: dragged across the ground at its height, or with Shift up and down, keeping where it looks
{
  let dragging = null, pending = null, grab = null;
  const raycaster = new THREE.Raycaster();
  const nearCentre = e => {
    world.updateMatrixWorld();
    const rect = renderer.domElement.getBoundingClientRect();
    let best = null, bd = 14;
    cams.forEach((cam, k) => {
      const v = new THREE.Vector3(...cam.C).applyMatrix4(world.matrixWorld).project(viewer);
      const d = Math.hypot(rect.left + (v.x + 1) / 2 * rect.width - e.clientX, rect.top + (1 - v.y) / 2 * rect.height - e.clientY);
      if (v.z < 1 && d < bd) { bd = d; best = k; }
    });
    return best;
  };
  // the pointer's ray in world coordinates (Z up) met with the level plane through the camera, or with Shift the
  // upright plane through it facing the viewer
  function onCameraPlane(e, k) {
    const rect = renderer.domElement.getBoundingClientRect();
    raycaster.setFromCamera(new THREE.Vector2((e.clientX - rect.left) / rect.width * 2 - 1, 1 - (e.clientY - rect.top) / rect.height * 2), viewer);
    world.updateMatrixWorld();
    const inv = world.matrixWorld.clone().invert();
    const o = raycaster.ray.origin.clone().applyMatrix4(inv), d = raycaster.ray.direction.clone().transformDirection(inv);
    const n = e.shiftKey ? new THREE.Vector3(d.x, d.y, 0).normalize() : new THREE.Vector3(0, 0, 1);
    const den = n.dot(d);
    if (Math.abs(den) < 1e-4) return null;
    const c = P.cams[k], t = n.dot(new THREE.Vector3(c.x, c.y, c.z).sub(o)) / den;
    return t > 0 ? o.addScaledVector(d, t) : null;
  }
  function dragTo(e) {
    if (dragging === null) return;
    const hit = onCameraPlane(e, dragging), c = P.cams[dragging];
    if (!hit) return;
    // measured from where it was taken (again when Shift changes), so it moves with the pointer without a jump
    if (!grab || grab.shift !== e.shiftKey) { grab = { shift: e.shiftKey, off: new THREE.Vector3(c.x, c.y, c.z).sub(hit) }; return; }
    const to = hit.add(grab.off), r2 = x => Math.round(x * 100) / 100;
    if (e.shiftKey) c.z = r2(Math.max(-1, Math.min(8, to.z)));

  worldEl.addEventListener('pointerdown', e => {
    if (e.target !== renderer.domElement) return;

    if (k === null) return;

    dragTo(e);
    renderer.domElement.setPointerCapture(e.pointerId);
    renderer.domElement.style.cursor = 'grabbing';
  }, true);
  renderer.domElement.addEventListener('pointermove', e => {
    if (dragging === null) { if (!e.buttons && nearCentre(e) !== null) renderer.domElement.style.cursor = 'grab'; return; }
    if (!pending) requestAnimationFrame(() => { dragTo(pending); pending = null; });
    pending = e;
  });
  const end = () => { if (dragging === null) return; dragging = null; controls.enabled = true; renderer.domElement.style.cursor = ''; };
  renderer.domElement.addEventListener('pointerup', end);
  renderer.domElement.addEventListener('pointercancel', end);
}
{
  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = controls.enabled ? [e.clientX, e.clientY] : null; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    const rect = renderer.domElement.getBoundingClientRect(), cands = [];
    world.updateMatrixWorld();
    for (const key of Object.keys(SHAPES)) {
      if (!P.show[key] || SHAPES[key].noVertices) continue;
      placed(key).forEach((X, i) => {
        const v = new THREE.Vector3(...X).applyMatrix4(world.matrixWorld).project(viewer);
        if (v.z < 1) cands.push({ obj: key, i, x: (v.x + 1) / 2 * rect.width, y: (1 - v.y) / 2 * rect.height });
      });
    }
    selectVertex(pickVertex(cands, e.clientX - rect.left, e.clientY - rect.top, 18));
  });
}
picCanvas.forEach((canvas, k) => {
  let drag = null, pending = null;
  const at = e => { const r = canvas.getBoundingClientRect(), tf = picTf[k]; return { X: e.clientX - r.left, Y: e.clientY - r.top, uv: [(e.clientX - r.left - tf.ox) / tf.s, (e.clientY - r.top - tf.oy) / tf.s] }; };
  const vertexNear = p => {
    const cands = [];
    for (const key of Object.keys(SHAPES)) {
      if (!P.show[key] || SHAPES[key].noVertices) continue;
      placed(key).forEach((X, i) => {
        const q = project(X, k);
        if (inFront(q, k)) cands.push({ obj: key, i, x: picTf[k].ox + picTf[k].s * q.uv[0], y: picTf[k].oy + picTf[k].s * q.uv[1] });
      });
    }
    return pickVertex(cands, p.X, p.Y, 14);
  };
  const pickPixel = p => { P.selected = { kind: 'pixel', cam: k, uv: p.uv.map(v => Math.round(v * 10) / 10) }; P.probe = null; update(); };
  canvas.addEventListener('pointerdown', e => {
    const p = at(e), hit = vertexNear(p);

  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = at(e);
    if (drag.hit && Math.hypot(p.X - drag.X, p.Y - drag.Y) > 6) drag = { pixel: true };   // dragged off: a pixel after all
    if (!drag.pixel) return;

    pending = p;
  });

// ----------------------------------------------------------------------------
// Maths panel
// ----------------------------------------------------------------------------
const fmt = (x, p = 4) => {
  if (!isFinite(x)) return '∞';
  if (Math.abs(x) < 5e-12) return '0';
  const s = String(+x.toPrecision(p));
  return s.includes('e') ? x.toExponential(p - 1) : s.replace('-', '−');
};
const fx1 = (x, n = 1) => isFinite(x) ? x.toFixed(n).replace('-', '−') : '∞';
const vec = (v, n = 3) => '(' + v.map(x => fx1(x, n)).join(', ') + ')';
function matrix(rows, f = fmt) {
  return `<span class="mat" style="grid-template-columns: repeat(${rows[0].length}, auto)">` + rows.map(r => r.map(x => `<span>${f(x)}</span>`).join('')).join('') + '</span>';
}
const openState = {};
function section(id, title, html) {
  return `<details data-id="${id}"${openState[id] === false ? '' : ' open'}><summary>${title}</summary>${html}</details>`;
}
const unitNorm = M => { const n = Math.hypot(...M.flat()) || 1, s = M[2][2] < 0 ? -1 : 1; return M.map(r => r.map(x => s * x / n)); };
const lineTxt = l => { const n = Math.hypot(l[0], l[1]) || 1; return `${fmt(l[0] / n, 3)} u + ${fmt(l[1] / n, 3)} v + ${fmt(l[2] / n, 4)} = 0`.replace(/\+ −/g, '− '); };
function epipoleTxt(e) {
  if (Math.abs(e[2]) > 1e-9 * Math.hypot(e[0], e[1])) {
    const u = e[0] / e[2], v = e[1] / e[2], inside = u >= 0 && u <= P.W && v >= 0 && v <= P.H;
    return `${vec([u, v], 1)} px${inside ? ' (inside the picture)' : ''}`;
  }
  const n = Math.hypot(e[0], e[1]);
  return `at infinity, direction ${vec([e[0] / n, e[1] / n], 3)}`;
}
function updateMath(sel) {
  const el = document.getElementById('math');
  el.querySelectorAll('details').forEach(d => { openState[d.dataset.id] = d.open; });
  let html = '';
  const { R, t, E, F, baseline } = geo;
  html += section('pose', 'Relative pose', `
    <div class="eq"><i class="v">X</i>₂ = <i class="v">R</i> <i class="v">X</i>₁ + <i class="v">t</i>, &nbsp;
      <i class="v">R</i> = <i class="v">R</i>₂<i class="v">R</i>₁ᵀ = ${matrix(R, x => fx1(x, 3))} &nbsp;
      <i class="v">t</i> = <i class="v">t</i>₂ − <i class="v">R t</i>₁ = ${matrix(t.map(x => [x]), x => fx1(x, 3))}</div>
    <div class="note num">Baseline |<i class="v">C</i>₂ − <i class="v">C</i>₁| = ${fmt(baseline, 3)} m. Both cameras: the same
      <i class="v">K</i>, f<sub>x</sub> = f<sub>y</sub> = ${fx1(cams[0].K[0][0], 1)} px, principal point at the picture's centre.</div>
    ${baseline < 1e-6 ? '<div class="note warn">The two centres coincide: with no baseline there is no epipolar geometry (E = 0); a pure rotation maps one picture onto the other point for point.</div>' : ''}`);
  html += section('E', 'Essential matrix E = [t]× R', `
    <div class="eq"><i class="v">E</i> = ${matrix(E, x => fmt(x, 3))}</div>
    <div class="note">x̂₂ᵀ <i class="v">E</i> x̂₁ = 0 for the normalised coordinates x̂ = <i class="v">K</i>⁻¹ x of any scene point's two
      images: the vectors from <i class="v">C</i>₁ and <i class="v">C</i>₂ to the point and the baseline <i class="v">t</i> lie in one plane, the epipolar plane.</div>`);
  html += section('F', 'Fundamental matrix F = K₂⁻ᵀ E K₁⁻¹', `
    <div class="eq"><i class="v">F</i> = ${matrix(unitNorm(F), x => fmt(x, 3))}</div>
    <div class="note">(scaled to unit norm; F is only defined up to scale.) x₂ᵀ <i class="v">F</i> x₁ = 0 for pixels; the epipolar
      line of x₁ in picture 2 is l₂ = <i class="v">F</i> x₁, of x₂ in picture 1 l₁ = <i class="v">F</i>ᵀ x₂. F has rank 2: all
      epipolar lines of a picture pass through its epipole.</div>
    <table class="steps">
      <tr><td>epipole e₁ (the image of C₂ in camera 1; F e₁ = 0)</td><td>${epipoleTxt(geo.e[0])}</td></tr>
      <tr><td>epipole e₂ (the image of C₁ in camera 2; Fᵀ e₂ = 0)</td><td>${epipoleTxt(geo.e[1])}</td></tr>
    </table>`);

    const rows = [];

    if (sel.kind === 'vertex') {
      title = `Selected point: ${SHAPES[P.selected.obj].label}, vertex ${P.selected.i}`;
      rows.push(['scene point X', vec(sel.X, 3)]);
      if (sel.ok[0]) rows.push(['in picture 1: x₁', vec(sel.q[0].uv, 1)]);
      if (sel.ok[1]) rows.push(['in picture 2: x₂', vec(sel.q[1].uv, 1)]);
      if (sel.ok[0] && sel.ok[1]) {
        rows.push(['its epipolar line in picture 2: l₂ = F x₁', lineTxt(sel.lines[1])]);
        rows.push(['its epipolar line in picture 1: l₁ = Fᵀ x₂', lineTxt(sel.lines[0])]);
        rows.push(['x₂ from l₂', `${fmt(Epi.pointLineDistance(sel.lines[1], sel.q[1].uv), 2)} px`]);
        rows.push(['x₂ᵀ F x₁ (F at unit norm)', fmt(Epi.residual(unitNorm(F), sel.q[0].uv, sel.q[1].uv), 2)]);

      rows.push([`x${sel.k ? '₂' : '₁'}`, vec(sel.uv, 1)]);
      rows.push([`its ray: C${sel.k ? '₂' : '₁'} + d · direction`, vec(sel.ray.dir, 3)]);
      rows.push([`its epipolar line in picture ${o + 1}: ${o ? 'l₂ = F x₁' : 'l₁ = Fᵀ x₂'}`, lineTxt(sel.lines[o])]);
      const pq = project(sel.probe.X, o);
      rows.push(['the probe (orange, drag it along the ray): at d', `${fmt(sel.probe.depth, 3)} m`]);
      if (inFront(pq, o)) rows.push([`its image in picture ${o + 1}, on the line`, vec(pq.uv, 1)]);
      if (v) {
        rows.push(['the vertex: on the ray at d', `${fmt(v.depth, 3)} m`]);
        if (v.ok[o]) {
          rows.push([`its image in picture ${o + 1}`, vec(v.q[o].uv, 1)]);
          rows.push(['its distance from the line', `${fmt(Epi.pointLineDistance(sel.lines[o], v.q[o].uv), 2)} px`]);
        }

    html += section('sel', title, `<table class="steps">${rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>
      <div class="note">${sel.kind === 'pixel'
        ? `Every scene point on this pixel's ray (the dots, ${sel.vertex ? 'the vertex among them' : 'spaced by equal angles as the other camera sees them'}) lands on the line in the other picture: from one picture alone the depth is unknown, and the search for the match is along that line.${sel.vertex ? ' The vertex is the one that is really there: its image is ringed on the line.' : ''}`

function updateCaption() {
  document.getElementById('caption').innerHTML = [
    `<span class="ln" style="border-color:${COL.epi}"></span>epipolar line of the selection`,
    `<span class="dot" style="background:${COL.epipole}"></span>epipole (the other camera's centre)`,
    P.showPencil ? 'colours: matching epipolar lines' : '',

}

// ----------------------------------------------------------------------------
// Controls
// ----------------------------------------------------------------------------
const gui = new GUI({ container: document.getElementById('gui'), title: 'Cameras' });
const refresh = () => gui.controllersRecursive().forEach(c => c.updateDisplay());
gui.add(P, 'preset', Object.keys(PRESETS)).name('preset').onChange(name => { P.cams = clone(PRESETS[name]); update(); });
const fIn = gui.addFolder('Intrinsics (both cameras)');
addMapped(fIn, P, 'focal', 8, 200, 0.1, LOG_MAP).name('focal length f (mm)').onChange(update);
fIn.add(P, 'sensorW', SENSORS).name('sensor').onChange(update);
fIn.add(P, 'resolution', Object.keys(RESOLUTIONS)).name('resolution').onChange(v => {
  const [w, h] = RESOLUTIONS[v], sx = w / P.W, sy = h / P.H;
  if (P.selected.kind === 'pixel') P.selected.uv = [P.selected.uv[0] * sx, P.selected.uv[1] * sy];
  P.W = w; P.H = h; update();
});
const camFolders = [0, 1].map(k => {
  const f = gui.addFolder(`Camera ${k + 1}`), c = () => P.cams[k];
  const proxy = {};

  f.add(proxy, 'z', -1, 8, 0.05).name('Z (m)').onChange(update);
  f.add(proxy, 'yaw', -180, 180, 0.5).name('yaw (°)').onChange(update);
  f.add(proxy, 'pitch', -89, 89, 0.5).name('pitch (°)').onChange(update);
  f.add(proxy, 'roll', -180, 180, 0.5).name('roll (°)').onChange(update);

  return f;
});
const fScene = gui.addFolder('Scene');
for (const key of Object.keys(SHAPES)) fScene.add(P.show, key).name(SHAPES[key].label).onChange(update);

addMapped(fView, P, 'planeScale', 1, 200, 1, LOG_MAP).name('camera enlarged ×').onChange(update);
gui.add({ reset: () => {
  const keep = clone(DEFAULTS);

  Object.assign(P.show, keep.show);
  update();
} }, 'reset').name('reset everything');
gui.controllersRecursive().filter(c => c._hasSlider).forEach(tameWheel);
camFolders.forEach(f => f.close()); fScene.close(); fView.close();
if (matchMedia('(max-width: 760px)').matches) gui.close();
document.getElementById('sw0').style.background = COL.cams[0];
document.getElementById('sw1').style.background = COL.cams[1];

// ----------------------------------------------------------------------------
function update() {
  buildCameras();
  const sel = selection();
  drawPicture(0, sel); drawPicture(1, sel);
  drawTexture(0, sel); drawTexture(1, sel);
  rebuild3D(sel);
  updateMath(sel);
  updateCaption();
  refresh();
  saveState();
  requestRender();
}
function layout() { resize3D(); const sel = selection(); drawPicture(0, sel); drawPicture(1, sel); }
new ResizeObserver(layout).observe(worldEl);
new ResizeObserver(() => { const sel = selection(); drawPicture(0, sel); drawPicture(1, sel); }).observe(document.getElementById('side'));
// the divider between the 3D view and the pictures: dragging it sets the pictures' share of the width, in per cent,
// remembered in this browser
{
  const app = document.getElementById('app'), bar = document.getElementById('splitter'), KEY = 'epipolar.split';
  const setSide = pc => app.style.setProperty('--side', Math.max(20, Math.min(75, pc)).toFixed(1) + '%');
  try { const pc = parseFloat(localStorage.getItem(KEY)); if (pc) setSide(pc); } catch (e) { /* storage blocked */ }
  let dragging = false;
  bar.addEventListener('pointerdown', e => { dragging = true; bar.setPointerCapture(e.pointerId); bar.classList.add('active'); e.preventDefault(); });
  bar.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = app.getBoundingClientRect();
    setSide((r.right - e.clientX) / r.width * 100);
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; bar.classList.remove('active');
    try { localStorage.setItem(KEY, parseFloat(app.style.getPropertyValue('--side'))); } catch (e) { /* ignore */ }
  };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
  bar.addEventListener('dblclick', () => { app.style.removeProperty('--side'); try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } });
}
update();
resize3D();
</script>
