name: Publish index.html to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site/3d site/2d
          cp index.html site/
          cp 3d/index.html site/3d/
          cp 2d/index.html site/2d/
          mkdir -p site/calculators && cp calculators/index.html calculators/optics.js site/calculators/
          mkdir -p site/pinhole_model && cp pinhole_model/index.html pinhole_model/camera.js site/pinhole_model/
          mkdir -p site/defocus && cp defocus/index.html defocus/camera.js defocus/lens.js site/defocus/
          mkdir -p site/epipolar && cp epipolar/index.html epipolar/camera.js epipolar/epipolar.js site/epipolar/
          cp 404.html favicon.ico site/
          # uppercase aliases: /2D and /3D are plain redirect pages to the real (lowercase) directories
          for d in 2d 3d; do
            l=$(echo $d | tr 'a-z' 'A-Z'); mkdir -p site/$l
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../%s/"><link rel="canonical" href="../%s/"><title>Redirect</title><a href="../%s/">%s</a>\n' $d $d $d $d > site/$l/index.html
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
